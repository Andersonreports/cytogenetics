# nginx in front of the web version: HTTPS, then to the container on 127.0.0.1:8000.
# Copy to /etc/nginx/sites-available/cyto-report, set server_name and the certificate
# paths (e.g. from certbot, or the hospital's own certificate), link it into
# sites-enabled and run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name cyto-reports.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cyto-reports.example.org;

    ssl_certificate     /etc/letsencrypt/live/cyto-reports.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyto-reports.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;          # VarSeq Excel uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;    # replaced, not appended: cannot be spoofed
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;       # the PDF / preview can take a while under load
    }
}

<!doctype html>
<html lang="en" data-user="{{ g.user or '' }}" data-fresh="{{ '1' if g.fresh else '0' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · CMC Cytogenetics Report</title>
<script src="{{ asset('js/tab.js') }}"></script>
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
<link rel="stylesheet" href="{{ asset('css/auth.css') }}">
</head>
<body class="auth-page">
<header>
  <h1>CMC Cytogenetics Report</h1>
  {% if g.user %}
    <span class="who">{{ g.user }}</span>
    <a class="btn ghost" href="{{ url_for('index') }}">Back to the report</a>
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline-form" data-logout>
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="btn ghost" type="submit">Log out</button>
    </form>
  {% endif %}
</header>
<main class="auth-main">
  <div class="auth-card {% block card_class %}{% endblock %}">
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<p class="auth-msg ok">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% if error %}<p class="auth-msg err" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </div>
</main>
<script src="{{ asset('js/auth.js') }}"></script>
</body>
</html>

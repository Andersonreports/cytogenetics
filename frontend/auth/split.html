<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · Germline-Cytogenetics Report Automation</title>
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
<link rel="stylesheet" href="{{ asset('css/auth.css') }}">
</head>
<body class="auth-page">
<div class="split">
  <section class="split-brand">
    <div class="split-dept"><span class="dot" aria-hidden="true"></span>Department of Cytogenetics · CMC Vellore</div>
    <div class="split-pitch">
      <h1>Germline-Cytogenetics Report Automation</h1>
      <p>Whole exome and mitochondrial gene sequencing reports, from VarSeq variant list to signed DOCX or PDF.</p>
    </div>
  </section>

  <section class="split-form">
    <div class="auth-form">
      {% block content %}{% endblock %}
    </div>
  </section>
</div>
<script src="{{ asset('js/auth.js') }}"></script>
</body>
</html>

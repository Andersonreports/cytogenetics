{% extends "auth/base.html" %}
{% block content %}
<h2>Sign in</h2>
{% if expired and not error %}<p class="auth-msg">Your sign-in ended. Sign in again; the report you were filling is kept.</p>{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">User name</label>
  <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button class="btn primary wide" type="submit">Sign in</button>
</form>
<p class="hint">Forgot your password? Ask an admin to reset it.</p>
{% endblock %}
